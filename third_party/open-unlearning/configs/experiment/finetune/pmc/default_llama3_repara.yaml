# @package _global_

defaults:
  - override /model: Llama-3.1-8B-Instruct
  - override /trainer: finetune
  - override /data: pmc_finetune_csv_repara
  - override /eval: null

mode: finetune
trainer:
  args:
    learning_rate: 1.5e-5
    weight_decay: 0.01
    warmup_epochs: 1.0
    num_train_epochs: 10

# fields included in the dataset
# options: [note, dialogue, patient, title]
