# @package _global_

defaults:
  - override /model: Llama-2-7b-hf.yaml
  - override /trainer: finetune
  - override /data: pmc_finetune
  - override /eval: null

mode: finetune
trainer:
  args:
    learning_rate: 1e-5
    weight_decay: 0.01
    warmup_epochs: 1.0
    num_train_epochs: 10

#fields included in the dataset
options: [note, dialogue, patient, title]
#modify here to include different combinations
data:
  train:
    PMC_QA:
      args:
        include: []

task_name: pmc_finetune_example
