# @package _global_

defaults:
  - override /model: Mistral-7B-Instruct-v0.2
  - override /trainer: RMU
  - override /data: null
  - override /eval: null

model:
  model_args:
    pretrained_model_name_or_path: /gs/bs/tga-TDSAI/h1kkk/unlearn/embedders/LLM2Vec/llm2vec/open_unlearning/saves/finetune/pmc_full_universal_Mistral-7B_continual

data:
  anchor: forget  # RMU使用forget作为anchor
  forget:
    CELEBRITY_ALL_FORGET:
      handler: CelebrityUnlearnDataset
      args:
        hf_args:
          path: csv
          data_files: 
            - /gs/bs/tga-TDSAI/h1kkk/unlearn/embedders/LLM2Vec/llm2vec/UnlearnData/easy_QA_PMC_forget100_state.csv
          split: train
        text_key: "0"
        max_length: 512
  retain:
    CELEBRITY_ALL_FORGET:
      handler: CelebrityUnlearnDataset
      args:
        hf_args:
          path: csv
          data_files:
            - /gs/bs/tga-TDSAI/h1kkk/unlearn/embedders/LLM2Vec/llm2vec/UnlearnData/easy_QA_PMC_retain900_full.csv
          split: train
        text_key: "0"
        max_length: 512

# RMU特有的训练配置
trainer:
  args:
    do_eval: False
    per_device_train_batch_size: 1     # RMU使用batch_size=1
    gradient_accumulation_steps: 16    # 通过梯度累积增加有效batch size
    learning_rate: 6e-5
    lr_scheduler_type: constant
    num_train_epochs: 5
    eval_strategy: 'no'
    eval_on_start: False
    save_strategy: 'no'
    logging_steps: 10
    bf16: True
    bf16_full_eval: True
    optim: paged_adamw_32bit
    remove_unused_columns: False

  method_args:
    # RMU特有参数
    gamma: 1.0
    steering_coeff: 2
    retain_loss_type: EMBED_DIFF  # 使用embedding差异作为retain loss
    alpha: 1.0 
    module_regex: model\.layers\.7  # 目标层，根据模型调整
    trainable_params_regex: 
      - model\.layers\.(5|6|7)\.mlp\.down_proj\.weight  # 可训练参数

# 使用左侧填充，适合生成任务
collator:
  DataCollatorForSupervisedDataset:
    args:
      padding_side: left

task_name: RMU_PMC__lr4e-5_epoch4
