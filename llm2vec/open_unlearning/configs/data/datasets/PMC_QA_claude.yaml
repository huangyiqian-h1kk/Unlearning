# configs/data/datasets/PMC_QA.yaml

# 只包含statement（最基本配置）
PMC_QA_statement_only:
  handler: PMCQADataset
  args:
    hf_args:
      path: "json"
      data_files: "/gs/bs/tga-TDSAI/h1kkk/unlearn/embedders/LLM2Vec/llm2vec/UnlearnData/PMC_QA_subset1000.jsonl"
      split: "train"
    include_fields: []  # 只包含statement，不包含其他字段
    max_length: 2048
    separator: "\n\n"

